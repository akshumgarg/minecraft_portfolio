<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akshum Garg's House</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="badge">your-name.smp | 1/1 players</div>
<div id="cross"></div><div id="tip"></div><div id="hotbar"></div><div id="msg"></div>
<div id="touch">
  <div class="dp" style="left:70px;bottom:130px" data-k="KeyW">▲</div>
  <div class="dp" style="left:70px;bottom:20px" data-k="KeyS">▼</div>
  <div class="dp" style="left:15px;bottom:75px" data-k="KeyA">◀</div>
  <div class="dp" style="left:125px;bottom:75px" data-k="KeyD">▶</div>
  <div class="dp" style="right:20px;bottom:130px" data-k="Space">⤒</div>
  <div class="dp" id="act" style="right:90px;bottom:60px;width:70px;height:70px">USE</div>
</div>
<div id="start" class="screen"><h1 id="title"></h1><p>Click to enter</p>
<p>WASD move · Mouse look · Click to open things</p><p>Shift run · Space jump · 1-5 quick open · Esc menu</p></div>
<div id="panel" class="screen"><div class="box"><div id="pbody"></div><button class="btn" id="close">Close (Esc)</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>
</body></html>
